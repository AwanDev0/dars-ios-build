name: Build Dars IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        working-directory: Dars
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Build
        run: |
          if xcodebuild \
            -project Dars.xcodeproj \
            -scheme Dars \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build.log 2>&1
          then
            echo "BUILD OK"
          else
            echo "BUILD FAILED"
            grep -E "error:" build.log | sort -u | head -300
            tail -40 build.log
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: Dars/build.log
          retention-days: 7

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Dars.app Payload/
          zip -qry Dars.ipa Payload
          ls -la Dars.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dars-ipa
          path: Dars/Dars.ipa
          retention-days: 14
